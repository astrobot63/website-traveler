<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Traveler</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1 id="title">Website Traveler</h1>

    <input
        type="text"
        placeholder="Enter a website name:"
        class="inputs"
        id="websiteNameHandler"
    >

    <span id="domainWrapper">

        <input
            type="text"
            id="domainHandler"
            placeholder="Default: .com"
            autocomplete="off"
        >

        <button type="button" id="domainArrow">▼</button>

        <nav id="domainMenu">
            <div data-domain=".com">.com</div>
            <div data-domain=".net">.net</div>
            <div data-domain=".org">.org</div>
            <div data-domain=".app">.app</div>
            <div data-domain=".game">.game</div>
            <div data-domain=".de">.de</div>
            <div data-domain=".cn">.cn</div>
            <div data-domain=".co">.co</div>
            <div data-domain=".my">.my</div>
        </nav>

    </span>

    <script src="main.js"></script>

    <br><br>

    <button onclick="travel()">Travel🚀</button>

    <br><br><br><br><br><br><br><br>

    <p>Developed by: Qusay Mohanad Abu-Nayla.</p>

</body>
</html>
